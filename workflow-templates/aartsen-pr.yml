name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr:
    uses: aartsengroup/shared-workflows/.github/workflows/pr-checks.yml@v1
    permissions:
      contents: read
      pull-requests: write
    # Optional overrides, see the reusable workflow for all inputs:
    # with:
    #   enable-lint: false
